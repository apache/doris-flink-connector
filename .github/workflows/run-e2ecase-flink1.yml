---
name: Run E2ECases Flink1.x
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-extension:
    name: "Run E2ECases"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        problem-matcher: true
        distribution: temurin
        java-version: '8'

    - name: Configure Doris prerequisites
      run: |
        sudo sysctl -w vm.max_map_count=2000000
        sudo swapoff -a

    - name: Run E2ECases (Flink1 module)
      run: |
        cd flink-doris-connector && mvn test \
          -Pflink1 -pl flink-doris-connector-it -am \
          -DfailIfNoTests=false \
          -Dtest="*E2ECase" \
          -Dimage="jnsimba/doris-all-in-one:4.1.3"
