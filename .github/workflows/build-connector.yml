---
name: Build Connector
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-extension:
    name: "Build Connector"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Setup java
      uses: actions/setup-java@v2
      with:
        distribution: adopt
        java-version: '8'

    - name: Build flink connector 1.15
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.15.0 \
          -Dflink.major.version=1.15 \
          -Dflink.python.id=flink-python_2.12

    - name: Build flink connector 1.16
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.16.0 \
          -Dflink.major.version=1.16

    - name: Build flink connector 1.17
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.17.0 \
          -Dflink.major.version=1.17

    - name: Build flink connector 1.18
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.18.0 \
          -Dflink.major.version=1.18

    - name: Build flink connector 1.19
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.19.0 \
          -Dflink.major.version=1.19

    - name: Build flink connector 1.20
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink1 -am \
          -Pflink1 \
          -Dflink.version=1.20.0 \
          -Dflink.major.version=1.20

    - name: Setup java
      uses: actions/setup-java@v2
      with:
        distribution: adopt
        java-version: '17'

    - name: Build flink connector 2.0
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink2 -am \
          -Pflink2 \
          -Dflink.version=2.0.0 \
          -Dflink.major.version=2.0

    - name: Build flink connector 2.1
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink2 -am \
          -Pflink2 \
          -Dflink.version=2.1.0 \
          -Dflink.major.version=2.1

    - name: Build flink connector 2.2
      run: |
        cd flink-doris-connector && mvn clean package \
          -pl flink-doris-connector-flink2 -am \
          -Pflink2 \
          -Dflink.version=2.2.0 \
          -Dflink.major.version=2.2

  build-flink2-jdk21:
    name: "Build Flink ${{ matrix.flink-major }} on JDK 21"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flink-version: 2.0.0
            flink-major: '2.0'
          - flink-version: 2.1.0
            flink-major: '2.1'
          - flink-version: 2.2.0
            flink-major: '2.2'
    defaults:
      run:
        shell: bash
        working-directory: flink-doris-connector
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Build Flink connector
      run: |
        mvn clean package \
          -pl flink-doris-connector-flink2 -am \
          -Pflink2 \
          -Dflink.version=${{ matrix.flink-version }} \
          -Dflink.major.version=${{ matrix.flink-major }}

    - name: Verify Java 17 bytecode
      run: |
        javap -verbose \
          flink-doris-connector-base/target/classes/org/apache/doris/flink/serialization/RowBatch.class \
          | grep -q 'major version: 61'
        javap -verbose \
          flink-doris-connector-flink2/target/classes/org/apache/doris/flink/table/DorisDynamicTableFactory.class \
          | grep -q 'major version: 61'
